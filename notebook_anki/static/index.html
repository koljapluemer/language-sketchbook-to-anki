<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Sketchbook</title>
<link rel="icon" href="/icon.svg">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-base-200 min-h-screen text-[15px]" x-data="app()" x-init="init()">

<header class="navbar bg-base-100 border-b border-base-300 gap-3 px-4 min-h-0 py-2">
  <h1 class="text-lg font-semibold mr-auto">Language Sketchbook → Anki</h1>
  <span class="badge badge-soft" :class="anki.ok ? 'badge-success' : 'badge-error'"
        x-text="anki.ok ? `Anki: ${anki.profile}` + (anki.note_types_installed ? '' : ' (note types missing)') : 'Anki not reachable'"></span>
  <button class="btn btn-sm" @click="openSettings()">Settings</button>
</header>

<div class="grid grid-cols-1 md:grid-cols-[260px_1fr] min-h-[calc(100vh-50px)]">
  <aside class="bg-base-100 p-3 border-b md:border-b-0 md:border-r border-base-300">
    <div class="border-2 border-dashed rounded-box p-4 text-center cursor-pointer mb-3"
         :class="dragging ? 'border-primary text-primary' : 'border-base-300 opacity-70'"
         @click="$refs.file.click()"
         @dragover.prevent="dragging = true" @dragleave="dragging = false"
         @drop.prevent="dragging = false; upload($event.dataTransfer.files)">
      Drop notebook pages here<br>or click to choose
      <input type="file" x-ref="file" accept="image/*" multiple hidden @change="upload($event.target.files); $event.target.value = ''">
    </div>
    <div class="text-xs uppercase tracking-wide opacity-60 mx-2 mt-3 mb-1">Your pages</div>
    <div class="text-sm opacity-60 px-2" x-show="!ownPages().length">None yet.</div>
    <ul class="menu w-full p-0">
      <template x-for="p in ownPages()" :key="p.id">
        <li><a class="flex gap-3 items-center" :class="{ 'menu-active': p.id === selectedId }" @click="select(p.id)">
          <img class="w-11 h-14 object-cover rounded border border-base-300 bg-white flex-none invert-90" :src="`/pages/${p.id}/thumb`" loading="lazy" alt="" @error="$el.style.visibility = 'hidden'">
          <div class="flex flex-col items-start gap-1 min-w-0">
            <span class="max-w-full truncate" x-text="pageTitle(p)" :title="pageTitle(p)"></span>
            <span class="text-xs opacity-60" x-show="pageLang(p)" x-text="pageLang(p)"></span>
            <span class="flex gap-1"><span class="badge badge-sm badge-soft" :class="statusClass(p.status)" x-text="p.status"></span>
              <span class="badge badge-sm badge-soft" x-show="p.version" x-text="`v${p.version + 1}`"></span></span>
          </div>
        </a></li>
      </template>
    </ul>
    <details class="collapse collapse-arrow mt-2" x-show="demoPages().length" :open="demosOpen" @toggle="demosOpen = $el.open">
      <summary class="collapse-title min-h-0 py-2 px-2 text-xs uppercase tracking-wide opacity-60 after:top-3">
        Demo pages <span class="badge badge-sm badge-soft ml-1" x-text="demoPages().length"></span></summary>
      <ul class="collapse-content menu w-full p-0">
        <template x-for="p in demoPages()" :key="p.id">
          <li><a class="flex gap-3 items-center" :class="{ 'menu-active': p.id === selectedId }" @click="select(p.id)">
            <img class="w-11 h-14 object-cover rounded border border-base-300 bg-white flex-none invert-90" :src="`/pages/${p.id}/thumb`" loading="lazy" alt="" @error="$el.style.visibility = 'hidden'">
            <div class="flex flex-col items-start gap-1 min-w-0">
              <span class="max-w-full truncate" x-text="pageTitle(p)" :title="pageTitle(p)"></span>
              <span class="text-xs opacity-60" x-show="pageLang(p)" x-text="pageLang(p)"></span>
              <span class="flex gap-1"><span class="badge badge-sm badge-soft" :class="statusClass(p.status)" x-text="p.status"></span>
                <span class="badge badge-sm badge-soft" x-show="p.version" x-text="`v${p.version + 1}`"></span></span>
            </div>
          </a></li>
        </template>
      </ul>
    </details>
  </aside>

  <main class="px-5 py-4 max-w-[1600px] min-w-0">
    <template x-if="!detail">
      <p class="opacity-60" x-text="ownPages().length ? 'Upload a page, or pick one on the left.' : 'Upload a page of your notebook, or open a demo page on the left to see what the app makes of one.'"></p>
    </template>

    <template x-if="detail">
      <div class="grid grid-cols-1 md:grid-cols-[minmax(260px,38%)_1fr] gap-5 items-start">
        <div class="min-w-0 md:sticky md:top-4">
          <a :href="pageImage()" target="_blank" title="Open full size"><img class="block max-w-full max-h-[50vh] md:max-h-[calc(100vh-70px)] mx-auto object-contain border border-base-300 rounded-box bg-white invert-90" :src="pageImage()" alt="Notebook page"></a>
          <div class="flex justify-center mt-2" x-show="reviewing()">
            <div class="join">
              <button class="btn btn-xs join-item" :class="{ 'btn-active': showBoxes }" @click="showBoxes = true">boxes</button>
              <button class="btn btn-xs join-item" :class="{ 'btn-active': !showBoxes }" @click="showBoxes = false">original</button>
            </div>
          </div>
        </div>
        <div class="min-w-0">
        <!-- processing -->
        <template x-if="['queued', 'extracting', 'thinking', 'error'].includes(detail.meta.status)">
          <div>
            <h2 class="text-xl font-semibold mb-3" x-text="pageTitle(detail.meta) + (detail.meta.version ? ` (version ${detail.meta.version + 1})` : '')"></h2>
            <p x-show="detail.meta.error" class="text-error mb-3" x-text="detail.meta.error"></p>
            <div class="bg-base-100 border border-base-300 rounded-box px-3 py-2 font-mono text-sm max-h-[60vh] overflow-auto whitespace-pre-wrap" x-ref="log"><template x-for="e in log"><div x-text="formatEvent(e)"></div></template></div>
            <div class="flex gap-2 my-3" x-show="detail.meta.status === 'error'"><button class="btn btn-sm" @click="rerun()">Retry</button></div>
          </div>
        </template>

        <!-- review -->
        <template x-if="reviewing()">
          <div>
            <div role="alert" class="alert alert-soft mb-4" x-show="detail.meta.demo">Demo page: an example notebook page, already processed. Edit and explore freely; “Add to Anki” creates real cards.</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <label><span class="text-xs opacity-70">Target language</span><input class="input input-sm w-full" x-model="detail.proposal.target_lang" @change="save()"></label>
              <label><span class="text-xs opacity-70">Native language</span><input class="input input-sm w-full" x-model="detail.proposal.native_lang" @change="save()"></label>
              <label><span class="text-xs opacity-70">Title: page name and deck <span x-text="detail.proposal.topic_source === 'generated' ? '(made up)' : '(from page)'"></span></span>
                <input class="input input-sm w-full" x-model="detail.proposal.topic" @change="save()"></label>
            </div>
            <div class="opacity-70 mt-2 mb-4">Deck: <b x-text="deckName()"></b></div>
            <p x-show="detail.anki_error" class="text-error mb-3" x-text="detail.anki_error"></p>

            <div class="card card-border bg-base-100 px-3 py-2 mb-4" x-show="detail.dropped?.length">
              <div><b>No longer on the page</b> <span class="text-xs opacity-60">(nothing is removed from Anki)</span></div>
              <template x-for="c in detail.dropped || []">
                <div class="flex gap-2 items-baseline py-1"><span x-text="`${c.front} – ${c.translation}`"></span>
                  <span class="badge badge-sm badge-soft" x-show="c.committed">in Anki</span>
                  <button class="btn btn-xs" @click="keepDropped(c)">Keep</button></div>
              </template>
            </div>

            <div role="alert" class="alert alert-warning alert-soft flex-col items-start gap-1 mb-4" x-show="pageFlags().length">
              <template x-for="f in pageFlags()">
                <div>⚠ <span x-text="f.message"></span></div>
              </template>
            </div>

            <div class="flex flex-wrap gap-2 items-center my-4">
              <span x-text="`${detail.proposal.cards.filter(c => c.include).length} of ${detail.proposal.cards.length} cards selected`"></span>
              <button class="btn btn-sm" @click="setAll(true)">All</button><button class="btn btn-sm" @click="setAll(false)">None</button>
              <label class="flex gap-2 items-center" x-show="unchangedCount()"><input type="checkbox" class="checkbox checkbox-sm" x-model="showUnchanged">
                <span x-text="`show unchanged (${unchangedCount()})`"></span></label>
              <span class="ml-auto"></span>
              <button class="btn btn-sm" @click="$refs.photo.click()" title="Added notes to this page? Upload a new photo of it; your review decisions are kept.">Update photo</button>
              <input type="file" x-ref="photo" accept="image/*" hidden @change="updatePhoto($event.target.files[0]); $event.target.value = ''">
              <button class="btn btn-sm" @click="rerun()">Re-run</button>
              <span class="text-sm text-warning" x-show="invalidCount()" x-text="`${invalidCount()} cloze card(s) to fix`"></span>
              <button class="btn btn-sm btn-primary" :disabled="busy || !anki.ok || invalidCount() > 0" :title="!anki.ok ? 'Anki is not reachable' : invalidCount() > 0 ? 'Fix the cloze cards marked ⚠ first' : ''" @click="commit()" x-text="busy ? 'Saving…' : 'Add to Anki'"></button>
            </div>

            <div class="mb-4" x-show="detail.commit">
              <b>Last commit:</b>
              <span x-text="commitSummary()"></span>
              <ul><template x-for="r in (detail.commit || []).filter(r => r.action === 'error')"><li class="text-error" x-text="`${r.key}: ${r.error}`"></li></template></ul>
            </div>

            <div class="flex flex-col gap-3">
              <template x-for="(c, i) in detail.proposal.cards" :key="i">
                <div class="card card-border bg-base-100 p-3 grid grid-cols-1 md:grid-cols-[130px_1fr] gap-3" :class="{ 'opacity-45': !c.include }" x-show="showUnchanged || versionStatus(i) !== 'unchanged'">
                  <div class="flex flex-col gap-2 items-start">
                    <label class="flex gap-2 items-center"><input type="checkbox" class="checkbox checkbox-sm" x-model="c.include"> include</label>
                    <span class="badge badge-sm badge-soft" x-text="c.kind + (c.source === 'generated' ? ' · generated' : '')"></span>
                    <span class="badge badge-sm badge-soft" :class="detail.existing[i] ? 'badge-warning' : 'badge-success'" x-text="detail.existing[i] ? 'update' : 'new'"></span>
                    <span class="badge badge-sm badge-soft" x-show="versionStatus(i)" :class="{ 'badge-success': versionStatus(i) === 'new on page', 'badge-warning': versionStatus(i) === 'changed' }" x-text="versionStatus(i)"></span>
                    <img class="max-w-[120px] max-h-[120px] bg-white rounded invert-90" x-show="c.image" :src="c.image ? file(c.image + '.png') : ''">
                    <select class="select select-sm w-full" x-model="c.image" @change="if (c.image === '') c.image = null">
                      <option value="">no sketch</option>
                      <template x-for="b in sketchBoxes()"><option :value="b" x-text="b" :selected="b === c.image"></option></template>
                    </select>
                    <label class="flex gap-2 items-center" x-show="!c.cloze" :title="c.production_reason"><input type="checkbox" class="checkbox checkbox-sm" x-model="c.production"> production card</label>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-2 content-start">
                    <label><span class="text-xs opacity-70">Front</span><input class="input input-sm w-full" dir="auto" x-model="c.front">
                      <div class="text-xs opacity-60" x-show="was(i, c.kind === 'vocab' ? 'Term' : 'Sentence', c.front)" x-text="'in Anki: ' + was(i, c.kind === 'vocab' ? 'Term' : 'Sentence', c.front)"></div>
                      <div class="text-xs opacity-60" x-show="before(i, 'front')" x-text="'before: ' + before(i, 'front')"></div></label>
                    <label><span class="text-xs opacity-70">Translation</span><input class="input input-sm w-full" dir="auto" x-model="c.translation">
                      <div class="text-xs opacity-60" x-show="was(i, 'Translation', c.translation)" x-text="'in Anki: ' + was(i, 'Translation', c.translation)"></div>
                      <div class="text-xs opacity-60" x-show="before(i, 'translation')" x-text="'before: ' + before(i, 'translation')"></div></label>
                    <label class="md:col-span-2"><span class="text-xs opacity-70">Notes</span><textarea class="textarea textarea-sm w-full min-h-0" dir="auto" x-model="c.notes" rows="2"></textarea>
                      <div class="text-xs opacity-60" x-show="before(i, 'notes')" x-text="'before: ' + before(i, 'notes')"></div></label>
                    <div class="md:col-span-2 text-xs opacity-60" x-show="c.production_reason" x-text="'Direction: ' + c.production_reason"></div>
                    <div class="md:col-span-2 flex flex-col gap-2" x-show="c.kind === 'sentence'">
                      <div class="flex flex-wrap gap-2 items-center">
                        <span class="text-xs opacity-70">Drill</span>
                        <div class="join">
                          <button class="btn btn-xs join-item" :class="{ 'btn-active': !c.cloze }" @click="setMode(i, null)" title="Whole sentence: recognition (and production) card">translate</button>
                          <button class="btn btn-xs join-item" :class="{ 'btn-active': c.cloze?.mode === 'focus' }" @click="setMode(i, 'focus')" title="One card blanking the word the sentence illustrates">focus</button>
                          <button class="btn btn-xs join-item" :class="{ 'btn-active': c.cloze?.mode === 'build' }" @click="setMode(i, 'build')" title="Cards blanking the last 1, 2, … chunks, up to the whole sentence">build</button>
                        </div>
                        <span class="loading loading-spinner loading-xs" x-show="rechunking[i]"></span>
                        <button class="btn btn-xs btn-ghost" x-show="c.cloze && !rechunking[i]" @click="rechunk(i)" title="Let Claude split the sentence again">re-chunk</button>
                        <template x-if="c.cloze?.mode === 'focus'">
                          <input class="input input-xs w-40" dir="auto" placeholder="hint" title="Shown in the blank" x-model="c.cloze.hint">
                        </template>
                      </div>
                      <template x-if="c.cloze?.chunks.length && !rechunking[i]">
                        <div class="flex flex-wrap items-center gap-0.5" dir="auto">
                          <template x-for="(ch, j) in c.cloze.chunks" :key="j">
                            <span class="contents">
                              <button class="badge whitespace-pre cursor-pointer" :class="c.cloze.focus.includes(j) ? 'badge-primary' : 'badge-ghost'"
                                      :title="(c.cloze.mode === 'focus' ? 'click: blank or unblank, ' : '') + 'shift-click: split'"
                                      @click="$event.shiftKey ? splitChunk(c, j) : c.cloze.mode === 'focus' && toggleFocus(c, j)" x-text="ch"></button>
                              <button class="btn btn-ghost btn-xs px-1 opacity-50" x-show="j < c.cloze.chunks.length - 1" @click="mergeChunks(c, j)" title="merge">+</button>
                            </span>
                          </template>
                        </div>
                      </template>
                      <template x-if="c.cloze && !rechunking[i]">
                        <div>
                          <div class="text-sm text-warning" x-show="clozeProblems(c).length" x-text="'⚠ ' + clozeProblems(c).join('; ')"></div>
                          <ol class="text-sm opacity-70 list-decimal list-inside" dir="auto" x-show="!clozeProblems(c).length">
                            <template x-for="p in clozePreview(c)"><li x-text="p"></li></template>
                          </ol>
                        </div>
                      </template>
                    </div>
                    <template x-for="f in cardFlags(i)">
                      <div class="md:col-span-2 text-sm text-warning">⚠ <span x-text="f.message"></span>
                        <template x-if="f.suggestion !== null && f.field && c[f.field] !== f.suggestion">
                          <button class="btn btn-xs" @click="applyFlag(f)" x-text="`use “${f.suggestion}”`"></button>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
        </div>
      </div>
    </template>
  </main>
</div>

<dialog class="modal" x-ref="settings">
  <div class="modal-box flex flex-col gap-3">
    <h3 class="text-lg font-semibold">Settings</h3>
    <label><span class="text-xs opacity-70">Main deck (all language decks go under it; empty = top level)</span>
      <input class="input input-sm w-full" x-model="settings.deck_root"></label>
    <label><span class="text-xs opacity-70">Claude model</span>
      <select class="select select-sm w-full" x-model="settings.model"><option>sonnet</option><option>opus</option><option>haiku</option></select></label>
    <label><span class="text-xs opacity-70">OCR device</span>
      <select class="select select-sm w-full" x-model="settings.ocr_device"><option value="gpu">GPU (NVIDIA)</option><option value="cpu">CPU</option></select></label>
    <label><span class="text-xs opacity-70">AnkiConnect URL</span><input class="input input-sm w-full" x-model="settings.anki_url"></label>
    <label><span class="text-xs opacity-70">Data folder (pages and settings). Your data is moved there on save; if it already holds app data, that is used instead.</span>
      <input class="input input-sm w-full" x-model="dataDir"></label>
    <div class="flex gap-2 items-center">
      <button class="btn btn-sm" @click="installNoteTypes()">Install / update note types</button>
      <span class="text-sm" :class="anki.ok ? 'text-success' : 'text-error'" x-text="anki.ok ? (anki.note_types_installed ? 'installed' : 'not installed') : anki.error"></span>
    </div>
    <div class="modal-action mt-2">
      <button class="btn btn-sm" @click="$refs.settings.close()">Cancel</button>
      <button class="btn btn-sm btn-primary" @click="saveSettings()">Save</button></div>
  </div>
</dialog>

<script>
function app() {
  return {
    pages: [], selectedId: null, detail: null, log: [], source: null,
    anki: { ok: false }, settings: {}, dataDir: '', demosOpen: true, dragging: false, busy: false, showBoxes: true, showUnchanged: false,
    rechunking: {},

    async init() {
      this.refreshAnki();
      this.settings = await this.api('/settings');
      await this.loadPages();
      const fromHash = location.hash.slice(1);
      if (this.pages.some(p => p.id === fromHash)) {
        if (fromHash.startsWith('demo-')) this.demosOpen = true;
        this.select(fromHash);
      }
      setInterval(() => this.loadPages(), 3000);
      setInterval(() => this.refreshAnki(), 10000);
    },
    async api(path, opts = {}) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      return r.json();
    },
    async refreshAnki() { this.anki = await this.api('/anki/status'); },
    async loadPages() {
      const hadOwn = this.ownPages().length;
      this.pages = await this.api('/pages');
      // the demos make way once there are pages of your own
      if (!hadOwn && this.ownPages().length) this.demosOpen = false;
      const cur = this.pages.find(p => p.id === this.selectedId);
      // reload the open page once it finishes processing
      if (cur && this.detail && cur.status !== this.detail.meta.status) this.select(cur.id, true);
    },
    ownPages() { return this.pages.filter(p => !p.demo); },
    demoPages() { return this.pages.filter(p => p.demo).sort((a, b) => this.pageTitle(a).localeCompare(this.pageTitle(b))); },
    // the open page's proposal is the live copy of what /pages reports, so edits show up in the sidebar while typing
    liveProposal(p) { return p.id === this.selectedId && this.detail?.proposal ? this.detail.proposal : null; },
    pageTitle(p) { return (this.liveProposal(p)?.topic ?? p.title ?? '').trim() || p.name; },
    pageLang(p) { return this.liveProposal(p)?.target_lang ?? p.lang; },
    async upload(files) {
      if (!files.length) return;
      const form = new FormData();
      for (const f of files) form.append('files', f);
      const created = await this.api('/pages', { method: 'POST', body: form });
      await this.loadPages();
      this.select(created[0].id);
    },
    async select(id, keepLog = false) {
      this.selectedId = id;
      history.replaceState(null, '', `#${id}`);
      this.detail = await this.api(`/pages/${id}`);
      this.rechunking = {};
      if (keepLog) return;
      this.log = [];
      if (this.source) this.source.close();
      this.source = new EventSource(`/pages/${id}/events`);
      this.source.onmessage = (m) => {
        this.log.push(JSON.parse(m.data));
        this.$nextTick(() => { if (this.$refs.log) this.$refs.log.scrollTop = 1e9; });
      };
    },
    formatEvent(e) {
      if (e.type === 'status') return `— ${e.status}${e.error ? ': ' + e.error : ''}`;
      if (e.type === 'tool') return `→ ${e.name} ${e.detail}`;
      if (e.type === 'done') return `✓ done in ${e.turns} turns` + (e.cost_usd ? ` (~$${e.cost_usd.toFixed(3)} API-equivalent)` : '');
      return e.text;
    },
    statusClass(s) { return { ready: 'badge-warning', committed: 'badge-success', error: 'badge-error' }[s] || ''; },
    file(name) { return `/pages/${this.selectedId}/files/${name}`; },
    reviewing() { return this.detail.proposal && ['ready', 'committed'].includes(this.detail.meta.status); },
    // the annotated page shows the box ids the sketch picker refers to; it only exists once processed
    pageImage() { return this.file(this.reviewing() && this.showBoxes ? 'annotated.png' : this.detail.meta.file); },
    deckName() {
      const p = this.detail.proposal;
      return [this.settings.deck_root, p.target_lang, p.topic].map(s => (s || '').trim()).filter(Boolean).join('::');
    },
    sketchBoxes() { return this.detail.proposal.boxes.filter(b => b.kind === 'sketch').map(b => b.id); },
    pageFlags() { return this.detail.proposal.flags.filter(f => f.card === null || f.card === undefined); },
    cardFlags(i) { return this.detail.proposal.flags.filter(f => f.card === this.detail.proposal.cards[i].key); },
    applyFlag(f) {
      const c = this.detail.proposal.cards.find(c => c.key === f.card);
      if (f.field in c) c[f.field] = f.suggestion;
      this.detail.proposal.flags = this.detail.proposal.flags.filter(x => x !== f);
    },
    was(i, field, current) {
      const old = this.detail.existing[i]?.fields?.[field];
      return old !== undefined && old !== current ? old : '';
    },
    setAll(v) { this.detail.proposal.cards.forEach(c => c.include = v); },
    // compared with the page's previous version (after "Update photo"); '' when there is none
    versionStatus(i) {
      if (!this.detail.previous) return '';
      const old = this.detail.previous[i], c = this.detail.proposal.cards[i];
      if (!old) return 'new on page';
      return ['front', 'translation', 'notes', 'production', 'cloze'].some(f => JSON.stringify(old[f] ?? null) !== JSON.stringify(c[f] ?? null)) ? 'changed' : 'unchanged';
    },
    unchangedCount() { return this.detail.proposal.cards.filter((_, i) => this.versionStatus(i) === 'unchanged').length; },
    before(i, field) {
      const old = this.detail.previous?.[i]?.[field];
      return old !== undefined && old !== this.detail.proposal.cards[i][field] ? old : '';
    },
    // cloze: Claude splits the sentence; the learner can merge, split and pick the blanked chunks
    async setMode(i, mode) {
      const c = this.detail.proposal.cards[i];
      if ((c.cloze?.mode ?? null) === mode) return;
      // focus and build cut a sentence differently, so a new mode gets new chunks
      c.cloze = mode && { mode, chunks: [], focus: [], hint: '' };
      if (mode) await this.rechunk(i);
    },
    async rechunk(i) {
      const c = this.detail.proposal.cards[i];
      this.rechunking[i] = true;
      try {
        c.cloze = await this.api(`/pages/${this.selectedId}/cloze`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: c.cloze.mode, card: c }),
        });
      } catch (e) { alert(e.message); }
      this.rechunking[i] = false;
    },
    toggleFocus(c, j) {
      const f = c.cloze.focus;
      c.cloze.focus = f.includes(j) ? f.filter(x => x !== j) : [...f, j].sort((a, b) => a - b);
    },
    mergeChunks(c, j) {
      const z = c.cloze, focused = z.focus.includes(j) || z.focus.includes(j + 1);
      z.chunks.splice(j, 2, z.chunks[j] + z.chunks[j + 1]);
      z.focus = z.focus.filter(x => x !== j && x !== j + 1).map(x => x > j ? x - 1 : x);
      if (focused) z.focus = [...z.focus, j].sort((a, b) => a - b);
    },
    splitChunk(c, j) {
      const z = c.cloze, parts = (prompt('Mark where to split with |', z.chunks[j]) || '').split('|');
      if (parts.length < 2 || parts.join('') !== z.chunks[j] || parts.some(p => !p.trim())) return;
      z.chunks.splice(j, 1, ...parts);
      const n = parts.length - 1;
      z.focus = z.focus.flatMap(x => x < j ? [x] : x > j ? [x + n] : parts.map((_, k) => j + k));
    },
    // mirrors Cloze.problems in models.py
    clozeProblems(c) {
      const z = c.cloze;
      if (!z) return [];
      if (!z.chunks.length) return ['no chunks yet: re-chunk'];
      const out = [];
      if (z.chunks.join('') !== c.front) out.push('sentence was edited: re-chunk');
      if ([...z.chunks, z.hint].some(t => ['{{', '}}', '::'].some(s => t.includes(s)))) out.push('no {{, }} or :: allowed');
      if (z.mode === 'build' && z.chunks.length < 2) out.push('build needs at least 2 chunks');
      if (z.mode === 'focus' && !z.focus.length) out.push('pick the chunk(s) to blank');
      if (z.mode === 'focus' && z.focus.length === z.chunks.length) out.push('leave some of the sentence visible');
      return out;
    },
    invalidCount() { return this.detail.proposal.cards.filter(c => c.include && this.clozeProblems(c).length).length; },
    // the card fronts as Anki will show them
    clozePreview(c) {
      const z = c.cloze, n = z.chunks.length;
      // whitespace around a blank stays, as in anki._cloze
      const blank = (t, hint = '') => t.replace(/\S(.*\S)?/s, `[${hint || '…'}]`);
      if (z.mode === 'build') {
        return z.chunks.map((_, k) => z.chunks.slice(0, n - k - 1).join('') + blank(z.chunks.slice(n - k - 1).join('')));
      }
      // adjacent blanked chunks make one blank, the first one shows the hint (as in anki.render_cloze)
      let out = '', run = '', hint = z.hint;
      z.chunks.forEach((ch, j) => {
        if (z.focus.includes(j)) { run += ch; return; }
        if (run) { out += blank(run, hint); run = ''; hint = ''; }
        out += ch;
      });
      if (run) out += blank(run, hint);
      return [out];
    },
    async keepDropped(c) {
      // its sketch box id belongs to the old photo
      const { committed, ...card } = c;
      this.detail.proposal.cards.push({ ...card, image: null });
      await this.save();
      // the server lines the kept card up with Anki and the previous version again
      this.select(this.selectedId, true);
    },
    commitSummary() {
      const n = (a) => (this.detail.commit || []).filter(r => r.action === a).length;
      return `${n('added')} added, ${n('updated')} updated, ${n('suspended')} suspended, ${n('error')} errors`;
    },
    async rerun() {
      await this.api(`/pages/${this.selectedId}/rerun`, { method: 'POST' });
      await this.loadPages();
      this.select(this.selectedId);
    },
    async updatePhoto(file) {
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      try {
        // edits not yet saved belong to the version being archived
        await this.save();
        await this.api(`/pages/${this.selectedId}/photo`, { method: 'POST', body: form });
      } catch (e) { return alert(e.message); }
      await this.loadPages();
      this.select(this.selectedId);
    },
    async save() {
      try {
        await this.api(`/pages/${this.selectedId}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.detail.proposal),
        });
      } catch (e) { return alert(e.message); }
      await this.loadPages();
    },
    async commit() {
      this.busy = true;
      try {
        await this.api(`/pages/${this.selectedId}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.detail.proposal),
        });
        await this.api(`/pages/${this.selectedId}/commit`, { method: 'POST' });
        await this.select(this.selectedId, true);
        await this.loadPages();
      } catch (e) { alert(e.message); }
      this.busy = false;
    },
    async openSettings() {
      this.settings = await this.api('/settings');
      this.dataDir = (await this.api('/data-dir')).path;
      this.$refs.settings.showModal();
    },
    async saveSettings() {
      try {
        // first, so settings.json is written to the new folder
        await this.api('/data-dir', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: this.dataDir }),
        });
      } catch (e) { return alert(e.message); }
      this.settings = await this.api('/settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.settings),
      });
      this.$refs.settings.close();
      this.refreshAnki();
      this.loadPages();
    },
    async installNoteTypes() {
      try { this.anki = await this.api('/anki/install', { method: 'POST' }); } catch (e) { alert(e.message); }
    },
  };
}
</script>
</body>
