[project]
name = "language-sketchbook-to-anki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.0.0.93",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu==3.4.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
language-sketchbook = "notebook_anki.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebook_anki"]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
